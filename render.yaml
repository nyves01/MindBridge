services:
  - type: web
    name: mindbridge-rwanda
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py seed_demo && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: mindbridge-rwanda-qlzw.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://mindbridge-rwanda-qlzw.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: DJANGO_EMAIL_HOST
        sync: false
      - key: DJANGO_EMAIL_PORT
        value: "587"
      - key: DJANGO_EMAIL_USE_TLS
        value: "True"
      - key: DJANGO_EMAIL_USE_SSL
        value: "False"
      - key: DJANGO_EMAIL_HOST_USER
        sync: false
      - key: DJANGO_EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_DEFAULT_FROM_EMAIL
        value: noreply@mindbridge-rwanda-qlzw.onrender.com
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mindbridge-db
          property: connectionString

databases:
  - name: mindbridge-db
    plan: free
